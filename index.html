    <style>
      html {
        margin: 0;
        height: 100%;
        height: -webkit-fill-available;
        background: #ffffff;
        background-color: #ffffff;
      }

      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background: #ffffff;
        background-color: #ffffff;
      }

      /* 앱 준비 전 root 숨김 — 스플래시 아래 홈 비침 방지 */
      html:not(.app-ready) #root {
        visibility: hidden;
        pointer-events: none;
      }

      #boot-splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10000;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100%;
        min-height: -webkit-fill-available;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding:
          max(28px, env(safe-area-inset-top, 0px))
          24px
          max(28px, env(safe-area-inset-bottom, 0px));
        background-color: #ffffff;
        background-image:
          radial-gradient(
            ellipse 80% 50% at 50% 0%,
            rgba(138, 46, 46, 0.06),
            transparent 55%
          ),
          linear-gradient(180deg, #ffffff 0%, #f7f5f3 100%);
        color: #0a0a0a;
      }

      #boot-splash img {
        width: min(128px, 34vw);
        height: auto;
        display: block;
      }

      #boot-splash .boot-name {
        margin: 0;
        font-family:
          "Bebas Neue", "Anton", Impact, "Arial Narrow Bold", sans-serif;
        font-size: clamp(48px, 14vw, 72px);
        font-weight: 400;
        letter-spacing: 0.08em;
        line-height: 0.92;
      }
    </style>
